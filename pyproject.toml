[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "group-essence-extractor"
version = "0.2.1"
description = "QQ群精华消息提取与检索工具"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.116.1",
  "pillow==11.3.0",
  "pydantic==2.13.3",
  "pytesseract==0.3.13",
  "python-dotenv==1.1.1",
  "requests==2.32.4",
  "uvicorn==0.35.0"
]

[project.urls]
Repository = "https://github.com/tntexploding/GroupEssence"

[project.scripts]
essence = "group_essence_extractor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
